# Other-manufacturer controller boards (Duet, MKS, Mellow, LDO, Huvud)
# Generated 2026-06-25
#
# Sourcing notes:
#   - Duet, LDO Leviathan, Huvud: dimensions parsed from authoritative KiCad .kicad_pcb
#     source files (Edge.Cuts outline + MountingHole footprint coordinates) and/or
#     official dimension drawing SVGs. Cross-confirmed where two sources existed.
#   - MKS: dimensions from official makerbase-mks GitHub SIZE.pdf mechanical drawings.
#   - Mellow Fly: dimensions from official mellow-3d.github.io dimension drawings,
#     cross-validated against official STEP CAD geometry (<0.1 mm agreement).
#   - holes_xy_mm are measured from the bottom-left corner of the PCB outline unless noted.
#   - PCB thickness is rarely published; 1.6 mm is the FR4 industry standard for these
#     boards but is flagged where not explicitly stated in a source.
#   - A "wrong dimension = failed print" mandate applies: low-confidence figures are
#     marked and must be verified against a STEP/physical board before cutting.

boards:

  # ============================ DUET3D ============================

  - id: duet3_6hc
    manufacturer: Duet3D
    name: Duet 3 Mainboard 6HC
    category: mainboard
    pcb:
      length_mm: 140.0
      width_mm: 134.0
      thickness_mm: 1.6
    mounting:
      screw: M3
      hole_dia_mm: 4.3
      pattern: rectangular
      pitch_x_mm: 124.0
      pitch_y_mm: 130.0
      hole_count: 4
      holes_xy_mm:
        - [5.0, 5.0]
        - [129.0, 5.0]
        - [5.0, 135.0]
        - [129.0, 135.0]
      inset_from_edge_mm: 5.0
      notes: >-
        Holes are isolated (non-plated) with a ~2.2 mm keep-out ring. Drilled
        Ø4.3 mm (M4 clearance) but Duet's own guides specify M3 screws. Width is
        134 mm, length 140 mm -- the commonly cited "144x96" figure is WRONG.
    thickness_clearance:
      standoff_height_mm: 8
      component_height_top_mm: null
    connectors:
      notes: >-
        USB + RJ45/Ethernet on one short edge; CAN_OUT on a long edge. PT100/
        thermocouple daughterboard header (2.54 mm) interior at approx [84,81].
    sources:
      - "https://github.com/Duet3D/Duet3-Mainboard-6HC/blob/master/Duet3_Mainboard_6HC_v1.0/Duet3_MB_6HC_v0.6%26later_Dimensions.svg"
      - "https://github.com/Duet3D/Duet3-Mainboard-6HC/blob/master/Duet3_Mainboard_6HC_v1.02/CAD/Duet3_MB_6HC.kicad_pcb"
      - "https://docs.duet3d.com/Duet3D_hardware/Duet_3_family/Duet_3_Mainboard_6HC_Hardware_Overview"
    confidence: high
    verify_notes: >-
      Outline + holes confirmed twice (dimension SVG and KiCad). Thickness 1.6 mm
      is standard but not explicitly annotated in the drawings.

