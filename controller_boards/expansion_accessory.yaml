# Expansion & accessory boards (drivers, thermocouple amps, accelerometers, relays, SSRs, converters)
# Researched 2026-06-25. Dimensions for a parametric CAD mounting library.
# Accuracy notes: thickness defaults to 1.6 mm where the source does not state it (flagged in notes).
# Hole diameters marked inferred where the manual gives a screw callout (e.g. M3) but no numeric bore.
boards:

  # ---------------------------------------------------------------------------
  # TMC / stepper driver modules
  # ---------------------------------------------------------------------------

  - id: stepstick_tmc2209
    manufacturer: Generic/various (Watterott SilentStepStick, BTT, FYSETC, etc.)
    name: TMC2209 StepStick / SilentStepStick driver module
    category: driver_module
    pcb:
      length_mm: 20.32          # 0.8 in
      width_mm: 15.24           # 0.6 in
      thickness_mm: 1.6
    mounting:
      screw: null
      hole_dia_mm: null
      pattern: none(header-mounted)
      pitch_x_mm: 15.24         # spacing between the two header rows (0.6 in)
      pitch_y_mm: 2.54          # pin pitch along each row (0.1 in)
      hole_count: 0
      holes_xy_mm: []
      inset_from_edge_mm: null
      notes: >-
        Standard Pololu/StepStick footprint 0.6 in x 0.8 in. Mounts via two 1x8
        (16-pin total) 0.1 in (2.54 mm) male headers, NOT screws. The two header
        rows sit 0.6 in (15.24 mm) apart, each row spanning 7 x 2.54 = 17.78 mm.
        TMC2208 plug-in module is the SAME footprint.
    thickness_clearance:
      standoff_height_mm: null
      component_height_top_mm: null   # heatsink adds ~5-10 mm on top, varies by vendor
    connectors:
      notes: "2x 1x8 0.1in male pin headers (plugs into stepper-driver socket)."
    sources:
      - "https://www.mouser.com/pdfDocs/TMC2209_SilentStepStick_Rev110.pdf"
      - "https://reprap.org/wiki/TMC2209"
      - "https://www.pololu.com/product/1182"
    confidence: high
    verify_notes: >-
      15.24 x 20.32 mm is the industry-standard StepStick/Pololu carrier size,
      corroborated by the TMC2209 SilentStepStick datasheet and the BTT MAX31865
      manual (which states it copies the stepper-driver footprint at exactly this
      size). Header-mounted only; no screw holes. Top heatsink height varies.

