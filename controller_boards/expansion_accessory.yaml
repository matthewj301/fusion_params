  - id: adafruit_max31865
    manufacturer: Adafruit
    name: Adafruit MAX31865 PT100/PT1000 RTD amplifier (PID 3328/3648)
    category: thermocouple_amp
    pcb:
      length_mm: 24.38          # body 0.96 in; overall incl. tabs 27.94 mm (1.1 in)
      width_mm: 22.86           # body 0.9 in; overall incl. tabs 25.4 mm (1.0 in)
      thickness_mm: 1.6
    mounting:
      screw: M2.5               # holes are 0.1 in = 2.54 mm; fit M2.5 (some distributor text says M3, that is wrong)
      hole_dia_mm: 2.54
      pattern: 2-hole
      pitch_x_mm: 22.86         # ~0.9 in horizontal center-to-center (on the mounting tabs)
      pitch_y_mm: 0.0
      hole_count: 2
      holes_xy_mm:
        - [1.27, 2.54]          # ~0.1 in down from top edge, ~1.27 in from each side of the tabs
        - [24.13, 2.54]
      inset_from_edge_mm: null
      notes: >-
        Two mounting tabs at the screw-terminal end. PCB body 24.38 x 22.86 mm;
        OVERALL incl. tabs 27.94 x 25.4 mm. Decide whether your mount uses the body
        or the tabbed outline. Holes Ø2.54 mm = M2.5, NOT M3.
    thickness_clearance:
      standoff_height_mm: null
      component_height_top_mm: 3.0   # Adafruit lists ~3.0 mm overall incl. terminal block
    connectors:
      notes: "Two 2-pin 3.5 mm screw terminals (RTD); 9-pin 0.1in breakout header (VIN/3V3/GND/CLK/SDO/SDI/CS/RDY)."
    sources:
      - "https://cdn-learn.adafruit.com/downloads/pdf/adafruit-max31865-rtd-pt100-amplifier.pdf"
      - "https://www.adafruit.com/product/3328"
    confidence: high
    verify_notes: >-
      Outline and Ø2.54 holes from Adafruit fab print p.30 (high). Screw size
      medium: Adafruit/distributor text inconsistent (M2.5 vs M3); physical bore
      = 2.54 mm => M2.5. PT1000 sibling 3648 is the identical PCB.

