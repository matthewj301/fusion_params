  - id: btt_tmc5160t_plus
    manufacturer: BIGTREETECH
    name: BTT TMC5160T Plus V1.0 external high-power stepper driver
    category: driver_module
    pcb:
      length_mm: 50.0
      width_mm: 50.0
      thickness_mm: 1.6
    mounting:
      screw: M3
      hole_dia_mm: 3.2          # inferred (M3 clearance); not numerically stated
      pattern: rectangular
      pitch_x_mm: 42.0          # 50 - 2 x 4.0 mm edge inset
      pitch_y_mm: 42.0
      hole_count: 4
      holes_xy_mm:
        - [4.0, 4.0]
        - [46.0, 4.0]
        - [4.0, 46.0]
        - [46.0, 46.0]
      inset_from_edge_mm: 4.0
      notes: >-
        Bare PCB 50 x 50 mm, four corner holes inset 4.0 mm per the official
        dimensional drawing. Overall with integrated heatsink ~58 x 50 x 28 mm;
        with case ~64 x 56 x 32.55 mm. Ships with M3x8 hardware.
    thickness_clearance:
      standoff_height_mm: null
      component_height_top_mm: 28.0   # overall height with heatsink
    connectors:
      notes: >-
        5-pole screw terminal (MOTOR 1B/2B/1A/2A + HVIN GND/8-60V); 16-pin
        drive connector + FFC EZ-driver connector on bottom edge; 2-pin 24V fan
        header; SPI/UART/standalone jumpers. Two large 560uF caps. VIO must not
        exceed 24V despite 60V motor supply.
    sources:
      - "https://github.com/bigtreetech/BIGTREETECH-Stepper-Motor-Driver/blob/master/TMC5160T%20Plus/BIGTREETECH%20TMC5160T%20Plus%20User%20Manual.pdf"
      - "https://bttwiki.com/TMC5160TPlus.html"
    confidence: high
    verify_notes: >-
      50x50 PCB and 4.0 mm corner inset are from the official drawing (high).
      Derived 42 mm pitch and M3 are medium; hole diameter and 1.6 mm thickness
      inferred (low). STEP file in repo can confirm exact hole coords.

