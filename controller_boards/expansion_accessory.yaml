  - id: gy291_adxl345
    manufacturer: Generic/various
    name: GY-291 ADXL345 accelerometer breakout
    category: accelerometer
    pcb:
      length_mm: 20.4           # commonly quoted 20.4-20.6
      width_mm: 15.8            # commonly quoted 15.4-16.0
      thickness_mm: 1.6
    mounting:
      screw: M3
      hole_dia_mm: 3.0
      pattern: 2-hole
      pitch_x_mm: 15.0          # center-to-center between the two collinear holes
      pitch_y_mm: 0.0
      hole_count: 2
      holes_xy_mm: []           # collinear pair near one short edge, 15.0 mm apart
      inset_from_edge_mm: null
      notes: >-
        The de-facto standard mount: 2 collinear Ø3 mm holes, 15 mm apart, on the
        edge opposite the pin header. The BTT USB boards copy this at 15.5 mm so
        they are mount-compatible. NO 4-corner hole pattern exists on this board.
    thickness_clearance:
      standoff_height_mm: null
      component_height_top_mm: null
    connectors:
      notes: "8-pin (or 7-pin) 2.54 mm header: GND/VCC/CS/SDO/SDA/SCL/INT1/INT2. SPI or I2C."
    sources:
      - "https://www.bastelgarage.ch/acceleration-sensor-adxl345-gy-291"
    confidence: medium
    verify_notes: >-
      2-hole / Ø3 / 15 mm spacing corroborated by an authoritative vendor and the
      community-standard layout. Exact outline varies slightly by clone; thickness
      assumed 1.6 mm. NOT a 4-hole board.

