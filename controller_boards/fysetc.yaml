  - id: fysetc_spider_pro_v1_2
    manufacturer: Fysetc
    name: Spider Pro V1.2
    category: mainboard
    pcb:
      length_mm: 179.0
      width_mm: 109.0
      thickness_mm: 1.6
    mounting:
      screw: M3
      hole_dia_mm: 3.2
      pattern: rectangular
      pitch_x_mm: 92.0
      pitch_y_mm: 92.0
      hole_count: 4
      holes_xy_mm:
        - [33.76, 14.20]
        - [33.76, 106.20]
        - [125.76, 14.20]
        - [125.76, 106.20]
      inset_from_edge_mm: null
      notes: >
        Measured directly from the vendor CAD file SPIDER_PRO_V1.2_CAD.dxf. PCB OUTLINE layer
        bbox = 179.0 x 109.0 mm. Four mounting holes form a 92 x 92 mm rectangular pattern at the
        listed centers (origin = DXF coordinate frame, NOT guaranteed to be the bottom-left PCB
        corner; the outline starts near X=26.8/Y=5.7 in the same frame, so subtract that offset if
        you need corner-relative coords). The hole circles read r=3.1 mm (copper ring/keepout);
        actual drill is M3 clearance (~3.2 mm). Two additional r=3.0 holes near the right edge at
        ~(201.7,18.3)/(201.7,102.1) appear to be secondary fixings. Spider Pro is a LARGER board
        than the standard Spider (155.3x76.5) — do not interchange mounts.
    thickness_clearance:
      standoff_height_mm: 5
      component_height_top_mm: null
    connectors:
      notes: Spider Pro is the higher-spec Spider with onboard isolated CAN etc.
    sources:
      - "https://github.com/FYSETC/Spider_Pro/blob/main/Hardware/SPIDER_PRO_V1.2_CAD.dxf"
    confidence: high
    verify_notes: >
      length/width and the 92x92 mm 4-hole pattern measured from vendor DXF (high). Hole-center
      origin is the DXF frame, not necessarily PCB corner — re-zero to the OUTLINE bbox before use.

