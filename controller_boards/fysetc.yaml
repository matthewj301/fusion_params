# Fysetc controller boards
# Compiled 2026-06-25
# Sources: official FYSETC GitHub hardware repos, wiki.fysetc.com markdown (github.com/FYSETC/wiki.fysetc),
#   FYSETC product pages, and dimensional/CAD files (DXF/STEP/PDF) shipped in the repos.
#
# CONFIDENCE NOTES (read before using):
# - PCB length/width figures marked "high" come from the official wiki spec line ("Compact size: X x Y mm")
#   or directly measured from a vendor CAD file (DXF OUTLINE layer / dimensioned drawing).
# - FYSETC does NOT publish explicit mounting-hole coordinate tables for most boards. Where exact
#   hole positions could not be extracted from an authoritative CAD/drawing file, the mounting block is
#   marked medium/low confidence and pitch/hole_count are null with an explanation. DO NOT treat a
#   null/low-confidence hole figure as print-ready without measuring a physical board or the STEP file.
# - Several boards intentionally copy third-party footprints (Voron / Creality Ender 3 / BTT / Stealthburner /
#   standard Mini12864). These are called out per board.

boards:

  # ----------------------------------------------------------------------------
  # SPIDER family (Voron 2.4 / Trident reference mainboard). All V1.x/V2.x/V3.0
  # share the same 155.3 x 76.5 mm PCB per the official wiki. Mounting holes are
  # 4x corner holes used by every Voron Spider mount/DIN bracket, but FYSETC
  # publishes no coordinate table; verify against board before relying on pitch.
  # ----------------------------------------------------------------------------

  - id: fysetc_spider_v1_x
    manufacturer: Fysetc
    name: Spider V1.x
    category: mainboard
    pcb:
      length_mm: 155.3
      width_mm: 76.5
      thickness_mm: 1.6
    mounting:
      screw: M3
      hole_dia_mm: 3.2
      pattern: rectangular
      pitch_x_mm: null
      pitch_y_mm: null
      hole_count: 4
      inset_from_edge_mm: null
      notes: >
        4 mounting holes, one near each corner (visible on the official Spider V1.0C/V1.1
        Designator Diagram PDFs). FYSETC does not publish exact hole coordinates. Hole
        diameter assumed M3 clearance (~3.2 mm) from community Spider mounts; not vendor-stated.
        V1.0/V1.1 differ electrically (5V@8A DC-DC) but share the Spider PCB outline.
    thickness_clearance:
      standoff_height_mm: 5
      component_height_top_mm: null
    connectors:
      notes: >
        STM32F446 mainboard for Voron 2.4 / Trident; 8 driver sockets. Tallest components are
        the driver heatsinks and electrolytic caps; top clearance not vendor-specified.
    sources:
      - "https://wiki.fysetc.com/Spider/"
      - "https://github.com/FYSETC/FYSETC-SPIDER (hardware/V1.x designator diagrams)"
    confidence: medium
    verify_notes: >
      PCB size high-confidence (wiki). Hole pattern/pitch unverified — measure a board or the
      V1.x designator diagram before cutting standoffs.

