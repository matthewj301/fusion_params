    connectors:
      notes: >
        STM32F072, onboard 2209, ADXL345, Micro-USB (firmware/DFU), HE0 (XH2.54 2P, 4A), CAN.
        Mounts behind the Stealthburner front; 2.5 m 4-core CAN cable included.
