# BigTreeTech controller boards
# Mechanical / mounting dimensions for a parametric CAD mounting-design library.
# Compiled: 2026-06-25
#
# ACCURACY NOTES (read before machining):
#  - PCB thickness (1.6 mm) is the BTT-standard FR4 value but is NOT annotated on
#    any official SIZE drawing. Treat every thickness_mm as an assumption.
#  - Mounting-hole DRILL diameters are almost never labeled by BTT. M3 -> 3.2 mm
#    clearance and M2.5 -> 2.7 mm clearance are conventions, not sourced figures.
#  - Where holes_xy_mm is null, BTT's drawing dimensions to connector edges rather
#    than a labeled hole grid; pull exact hole centers from the in-repo STEP model.
#  - confidence reflects the PCB OUTLINE + mounting PATTERN reliability, not the
#    assumed fields above. Read verify_notes per board.

boards:

  # ===================== MAINBOARDS =====================

  - id: btt_skr_mini_e3_v3
    manufacturer: BigTreeTech
    name: SKR Mini E3 V3
    category: mainboard
    pcb:
      length_mm: 103.75
      width_mm: 70.25
      thickness_mm: 1.6
    mounting:
      screw: M3
      hole_dia_mm: 3.2
      pattern: other-describe
      pitch_x_mm: null
      pitch_y_mm: null
      hole_count: 6
      holes_xy_mm: null
      inset_from_edge_mm: null
      notes: >
        Drops into the Ender-3 / Ender-3 Pro/V2 board location and reuses the
        original Creality mounting bosses, so the hole pattern is IRREGULAR (not
        a clean rectangle). Official SIZE drawing shows 6 plated mounting holes.
        Per-hole [x,y] NOT reconstructed (drawing leader lines are partial);
        pull exact centers from the in-repo STEP file. Two PCB revisions exist
        in the repo (V3.0 and V3.0.1); these dims are the canonical V3.0.
    thickness_clearance:
      standoff_height_mm: null
      component_height_top_mm: null
    connectors:
      notes: >
        Stepper/endstop/fan headers along top edge (XM/YM/ZM/EM); POWER, heated-
        bed and hotend screw terminals on bottom-left edge; USB-C, TFT/EXP and
        thermistor/probe headers clustered bottom and right. Right edge has a tab
        carrying the I/O / display connector.
    sources:
      - "https://github.com/bigtreetech/BIGTREETECH-SKR-mini-E3/blob/master/hardware/BTT%20SKR%20MINI%20E3%20V3.0/Hardware/BTT%20E3%20SKR%20MINI%20V3.0_SIZE_20220301.pdf"
      - "https://global.bttwiki.com/SKR%20MINI%20E3.html"
    confidence: medium
    verify_notes: >
      Overall 103.75 x 70.25 mm and 6-hole count are HIGH confidence (official
      SIZE PDF). Per-hole coordinates and hole diameter are LOW — derive
      holes_xy from BTT E3 SKR MINI V3.0.step before cutting. Thickness assumed.

