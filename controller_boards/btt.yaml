  # ===================== SBC (compute modules) =====================

  - id: btt_cb1
    manufacturer: BigTreeTech
    name: CB1
    category: sbc
    pcb:
      length_mm: 55.0
      width_mm: 40.0
      thickness_mm: 1.6
    mounting:
      screw: M2.5
      hole_dia_mm: 2.7
      pattern: rectangular
      pitch_x_mm: 48.0
      pitch_y_mm: 33.0
      hole_count: 4
      holes_xy_mm:
        - [3.5, 3.5]
        - [51.5, 3.5]
        - [3.5, 36.5]
        - [51.5, 36.5]
      inset_from_edge_mm: 3.5
      notes: >
        BTT wiki: product size 40 x 55 mm, "mounting size" 33 x 48 mm. The
        33 x 48 rectangle IS the mounting-hole pitch and is the Raspberry Pi CM4
        standard 4-hole pattern (CB1 is CM4-form-factor compatible). 3.5 mm inset
        on all sides is self-consistent ((55-48)/2 and (40-33)/2). hole_dia 2.7
        and M2.5 from the RPi CM4 datasheet. holes_xy computed (origin =
        bottom-left). FORM FACTOR: board-to-board / CM4-style module (two 100-pin
        BTB connectors on underside), NOT a SODIMM edge card.
    thickness_clearance:
      standoff_height_mm: 5
      component_height_top_mm: null
    connectors:
      notes: >
        Underside: two 100-pin micro BTB connectors mating to a CM4-style
        carrier (Manta, Pi4B adapter). 40-pin GPIO header on top edge.
    sources:
      - "https://global.bttwiki.com/CB1.html"
      - "https://datasheets.raspberrypi.com/cm4/cm4-datasheet.pdf"
    confidence: medium
    verify_notes: >
      Board size 40 x 55 and mounting 33 x 48 authoritative (BTT wiki). Hole
      diameter, M2.5, 3.5 mm inset, 1.6 mm thickness inferred from CM4
      compatibility, NOT explicitly published by BTT. holes_xy computed.

